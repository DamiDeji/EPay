# EPay observability stack.
#
#   docker compose -f monitoring/docker-compose.monitoring.yml up -d
#
# Then: Grafana http://localhost:3003 (admin/admin), Prometheus :9090,
# Alertmanager :9093. The stack scrapes the API/indexer running on the host via
# `host.docker.internal` when EPAY_ENV=local; in staging it scrapes the k8s
# Service DNS names from prometheus.yml.
name: epay-monitoring

services:
  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    ports:
      - '9090:9090'
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - ./secrets:/etc/prometheus/secrets:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.28.0
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    ports:
      - '9093:9093'
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
      - ./secrets:/etc/alertmanager/secrets:ro
      - alertmanager-data:/alertmanager
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_INSTALL_PLUGINS: ''
    ports:
      - '3003:3000'
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.0
    environment:
      DATA_SOURCE_NAME: ${POSTGRES_EXPORTER_DSN:-postgresql://epay:epay@postgres:5432/epay?sslmode=disable}
    ports:
      - '9187:9187'
    restart: unless-stopped

  # Exposes epay_queue_* metrics consumed by the queue-lag dashboard.
  bullmq-exporter:
    image: ghcr.io/sn8w/bullmq-exporter:v1.2.0
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      BULLMQ_QUEUE_NAMES: ${BULLMQ_QUEUE_NAMES:-indexer,webhooks,settlements,notifications}
    ports:
      - '9538:9538'
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.2
    command: ['--path.procfs=/host/proc', '--path.sysfs=/host/sys', '--path.rootfs=/rootfs']
    ports:
      - '9100:9100'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    restart: unless-stopped

  # Pushes the backup/restore-drill heartbeat metrics that the
  # EpayBackupMissed and EpayRestoreDrillFailed alerts depend on.
  pushgateway:
    image: prom/pushgateway:v1.9.0
    ports:
      - '9091:9091'
    restart: unless-stopped

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
