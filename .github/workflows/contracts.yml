name: Contracts

on:
  push:
    branches: [main, develop]
    paths:
      - 'packages/contracts/**'
      - '.github/workflows/contracts.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/contracts/**'
      - '.github/workflows/contracts.yml'
  workflow_dispatch:

jobs:
  soroban-contracts:
    name: Soroban Smart Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        contract:
          - payment-router
          - merchant-registry
          - escrow-manager
          - treasury-vault
          - refund-manager
          - subscription-manager
          - invoice-manager
          - fee-manager
          - settlement-manager
          - role-manager
          - configuration-manager
          - emergency-pause
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.89'
          target: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            packages/contracts/target/
          key: cargo-contracts-${{ runner.os }}-${{ hashFiles('packages/contracts/Cargo.lock') }}
          restore-keys: |
            cargo-contracts-${{ runner.os }}-

      - name: Format check
        working-directory: packages/contracts
        run: cargo fmt --check

      - name: Clippy
        working-directory: packages/contracts
        run: cargo clippy -p ${{ matrix.contract }} -- -D warnings

      - name: Test
        working-directory: packages/contracts
        run: cargo test -p ${{ matrix.contract }}

      - name: Build (wasm)
        working-directory: packages/contracts
        run: cargo build -p ${{ matrix.contract }} --target wasm32-unknown-unknown --release

  optimize:
    name: Optimize WASM
    needs: soroban-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.89'
          target: wasm32-unknown-unknown
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            packages/contracts/target/
          key: cargo-contracts-${{ runner.os }}-${{ hashFiles('packages/contracts/Cargo.lock') }}
          restore-keys: |
            cargo-contracts-${{ runner.os }}-

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libudev-dev pkg-config
      - name: Install soroban-cli
        run: cargo install soroban-cli --version 23.0.1 --locked

      - name: Build all contracts
        working-directory: packages/contracts
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Optimize WASM blobs
        working-directory: packages/contracts
        run: |
          mkdir -p optimized
          for wasm in target/wasm32-unknown-unknown/release/*.wasm; do
            name=$(basename "$wasm" .wasm)
            soroban contract optimize --wasm "$wasm" > "optimized/${name}.optimized.wasm"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: soroban-wasm
          path: packages/contracts/optimized/
