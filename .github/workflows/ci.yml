name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Enable corepack
        run: corepack enable
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
        env:
          TURBO_CONCURRENCY: 4

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Enable corepack
        run: corepack enable
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
        env:
          TURBO_CONCURRENCY: 4

  contracts:
    name: Contracts (Soroban)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.89'
          target: wasm32-unknown-unknown
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            packages/contracts/target/
          key: cargo-contracts-${{ runner.os }}-${{ hashFiles('packages/contracts/Cargo.lock') }}
          restore-keys: |
            cargo-contracts-${{ runner.os }}-
      - name: Clippy
        run: cargo clippy --manifest-path packages/contracts/Cargo.toml -- -D warnings
      - name: Test
        run: cargo test --manifest-path packages/contracts/Cargo.toml
      - name: Build (wasm)
        run: cargo build --manifest-path packages/contracts/Cargo.toml --target wasm32-unknown-unknown --release

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: epay
          POSTGRES_PASSWORD: epay_test
          POSTGRES_DB: epay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - name: Enable corepack
        run: corepack enable
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Run database migrations
        run: pnpm --filter @epay/database exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://epay:epay_test@localhost:5432/epay_test
      - run: pnpm build
        env:
          DATABASE_URL: postgresql://epay:epay_test@localhost:5432/epay_test
          TURBO_CONCURRENCY: 4
      - run: pnpm test:coverage
        env:
          DATABASE_URL: postgresql://epay:epay_test@localhost:5432/epay_test
          REDIS_URL: redis://localhost:6379
          TURBO_CONCURRENCY: 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: packages/*/coverage/

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Enable corepack
        run: corepack enable
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Run npm audit
        run: pnpm audit --audit-level=high
        continue-on-error: true
      - name: Install gitleaks
        run: |
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar xzf gitleaks_8.21.2_linux_x64.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Check for secrets
        run: gitleaks detect --config .gitleaks.toml --verbose --no-git
        continue-on-error: true
