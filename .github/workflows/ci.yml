name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Enable corepack
        run: corepack enable
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
        env:
          TURBO_CONCURRENCY: 4

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Enable corepack
        run: corepack enable
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
        env:
          TURBO_CONCURRENCY: 4

  helm:
    name: Helm Chart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: Lint chart
        run: helm lint helm/epay
      - name: Render chart
        run: helm template epay helm/epay --namespace epay >/dev/null
      - name: Production values must pin image digests
        run: |
          if helm template epay helm/epay -f helm/epay/values.production.yaml >/dev/null 2>&1; then
            echo "::error::values.production.yaml rendered successfully without pinned image digests"
            exit 1
          fi
      - name: Raw manifests match the chart
        run: |
          ./scripts/render-k8s-manifests.sh
          git diff --exit-code k8s/manifests.yaml

  contracts:
    name: Contracts (Soroban)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.89'
          target: wasm32-unknown-unknown
          components: clippy
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            packages/contracts/target/
          key: cargo-contracts-${{ runner.os }}-${{ hashFiles('packages/contracts/Cargo.lock') }}
          restore-keys: |
            cargo-contracts-${{ runner.os }}-
      - name: Clippy
        run: cargo clippy --manifest-path packages/contracts/Cargo.toml -- -D warnings
      - name: Test
        run: cargo test --manifest-path packages/contracts/Cargo.toml
      - name: Build (wasm)
        run: cargo build --manifest-path packages/contracts/Cargo.toml --target wasm32-unknown-unknown --release

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: epay
          POSTGRES_PASSWORD: epay_test
          POSTGRES_DB: epay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - name: Enable corepack
        run: corepack enable
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Run database migrations
        run: pnpm --filter @epay/database exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://epay:epay_test@localhost:5432/epay_test
      - run: pnpm build
        env:
          DATABASE_URL: postgresql://epay:epay_test@localhost:5432/epay_test
          TURBO_CONCURRENCY: 4
      - run: pnpm test:coverage
        env:
          DATABASE_URL: postgresql://epay:epay_test@localhost:5432/epay_test
          REDIS_URL: redis://localhost:6379
          TURBO_CONCURRENCY: 2
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: packages/*/coverage/

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Enable corepack
        run: corepack enable
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # The web app imports `@epay/ui` and `@epay/shared` from their built
      # `dist/`, so the workspace has to be built before the dev server can
      # start.
      - name: Build workspace
        run: pnpm build
        env:
          TURBO_CONCURRENCY: 4
      - name: Install Playwright browsers
        run: pnpm --filter @epay/tests exec playwright install --with-deps
      # Playwright starts and stops `@epay/web` itself (see the `webServer`
      # block); CI sets `reuseExistingServer: false` so a stale server can never
      # be mistaken for a passing run. A failure here fails the workflow.
      - name: Run E2E suite
        run: pnpm --filter @epay/tests e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: |
            tests/playwright-report/
            tests/test-results/
          retention-days: 7

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Enable corepack
        run: corepack enable
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Run npm audit
        run: pnpm audit --audit-level=high
        continue-on-error: true
      - name: Install gitleaks
        run: |
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar xzf gitleaks_8.21.2_linux_x64.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Check for secrets
        # Blocking: supply-chain.yml runs the same scan over full history. This
        # one is the fast pre-merge gate over the working tree.
        run: gitleaks detect --config .gitleaks.toml --verbose --no-git
