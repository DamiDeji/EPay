{{- if .Values.secrets.create }}
{{/*
  Development-only placeholder. In production, manage this Secret with Sealed
  Secrets or External Secrets Operator and point .Values.secrets.existingSecret
  at it — never commit credentials to values.yaml.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "epay.appSecretName" . }}
  labels:
    {{- include "epay.labels" . | nindent 4 }}
  annotations:
    epay.dev/warning: 'placeholder credentials — development only'
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ required "postgres.auth.password is required when secrets.create=true" .Values.postgres.auth.password | quote }}
  JWT_SECRET: {{ required "jwtSecret is required when secrets.create=true" .Values.jwtSecret | quote }}
  WEBHOOK_SECRET: {{ .Values.webhookSecret | default (randAlphaNum 32) | quote }}
  METRICS_TOKEN: {{ .Values.metricsToken | default (randAlphaNum 32) | quote }}
  ANTHROPIC_API_KEY: {{ .Values.anthropicApiKey | default "" | quote }}
{{- end }}
