{{- range .Values.frontends }}
{{- if .enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "epay.fullname" $ }}-{{ .name }}
  labels:
    {{- include "epay.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ .name }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    {{- include "epay.selectorLabels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ .name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "epay.fullname" $ }}-{{ .name }}
  labels:
    {{- include "epay.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ .name }}
spec:
  {{- if not $.Values.autoscaling.enabled }}
  replicas: {{ .replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "epay.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ .name }}
  template:
    metadata:
      labels:
        {{- include "epay.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ .name }}
    spec:
      securityContext:
        {{- include "epay.podSecurityContext" $ | nindent 8 }}
      containers:
        - name: {{ .name }}
          image: {{ include "epay.image" (dict "root" $ "image" .image) }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .port }}
          env:
            - name: NODE_ENV
              value: production
            - name: NEXT_PUBLIC_API_URL
              value: https://{{ (index $.Values.frontends 0).host }}
            - name: PORT
              value: {{ .port | quote }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            {{- include "epay.containerSecurityContext" $ | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /app/.next/cache
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
{{- end }}
{{- end }}
