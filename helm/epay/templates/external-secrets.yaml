{{- if .Values.externalSecrets.enabled }}
{{/*
  External Secrets Operator: pull real credentials from a secret manager
  (AWS Secrets Manager, GCP Secret Manager, Vault, 1Password, ...) at runtime
  instead of committing Kubernetes Secrets.

  Requires the External Secrets CRDs and a SecretStore/ClusterSecretStore to
  exist. The resulting Secret must be named exactly
  `.Values.secrets.existingSecret` (default `epay-secrets`) because every
  Deployment mounts that name.

  See docs/external-secrets.md for setup and rotation.
*/}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecrets.targetSecret }}
  labels:
    {{- include "epay.labels" . | nindent 4 }}
  annotations:
    epay.dev/managed-by: external-secrets-operator
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ required "externalSecrets.secretStoreRef.name is required" .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
  target:
    name: {{ .Values.externalSecrets.targetSecret }}
    # Owner: the operator owns the lifecycle and deletes the Secret when this
    # ExternalSecret is removed. Use Merge only if other tooling also writes to it.
    creationPolicy: Owner
  data:
    {{- range .Values.externalSecrets.keys }}
    - secretKey: {{ .key }}
      remoteRef:
        key: {{ printf "%s/%s" $.Values.externalSecrets.remoteKey (.remoteKey | default .key) | quote }}
        {{- if .property }}
        property: {{ .property | quote }}
        {{- end }}
    {{- end }}
{{- end }}
