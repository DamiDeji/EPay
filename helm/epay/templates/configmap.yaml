apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "epay.fullname" . }}-config
  labels:
    {{- include "epay.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- range $key, $value := .Values.api.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  METRICS_PORT: {{ .Values.indexer.metricsPort | quote }}
