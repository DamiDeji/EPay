[package]
name = "impact-nft"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

# See governance/Cargo.toml: the `std` feature does not exist on soroban-sdk 21
# and made the workspace unresolvable. `testutils` is what the test module needs.

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
