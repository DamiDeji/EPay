[workspace]
resolver = "2"
members = [
  "contracts/payment-router",
  "contracts/merchant-registry",
  "contracts/escrow-manager",
  "contracts/treasury-vault",
  "contracts/refund-manager",
  "contracts/subscription-manager",
  "contracts/invoice-manager",
  "contracts/fee-manager",
  "contracts/settlement-manager",
  "contracts/role-manager",
  "contracts/configuration-manager",
  "contracts/emergency-pause",
]

[workspace.dependencies]
soroban-sdk = "21.0.0"
soroban-token-sdk = "21.0.0"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
