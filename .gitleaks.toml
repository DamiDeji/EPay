# Gitleaks configuration for EPay.
# https://github.com/gitleaks/gitleaks#configuration
#
# This config extends the default rule set and adds rules for the things EPay
# actually handles: Stellar secret keys, API keys, and provider tokens.
#
# The allowlist is intentionally narrow. A broad allowlist is how a scanner
# becomes decorative, so every entry below is a specific known-safe path or a
# documented placeholder value.

title = "EPay Gitleaks Config"

[extend]
useDefault = true

# ── EPay-specific rules ───────────────────────────────────────────────────────

[[rules]]
id = "stellar-secret-key"
description = "Stellar secret key (StrKey, S...)"
# A Stellar secret key controls real funds. There is never a legitimate reason
# for one to be committed.
regex = '''\bS[A-Z2-7]{55}\b'''
tags = ["stellar", "private-key", "critical"]

[[rules]]
id = "epay-api-key"
description = "EPay API key"
regex = '''\bepay_(live|test)_[A-Za-z0-9]{24,}\b'''
tags = ["epay", "api-key"]

[[rules]]
id = "epay-webhook-signature"
description = "EPay webhook signing secret"
# `secretGroup = 1` reports only the value, so the key name is not what gets
# compared against the allowlist. The group was previously missing, which made
# the index meaningless.
regex = '''(?i)webhook[_\-]?secret\s*[:=]\s*["']?([A-Za-z0-9_\-]{16,})'''
secretGroup = 1
tags = ["epay", "webhook"]

[[rules]]
id = "anthropic-api-key"
description = "Anthropic API key"
regex = '''\bsk-ant-[A-Za-z0-9\-_]{24,}\b'''
tags = ["anthropic", "api-key"]

[[rules]]
id = "postgres-uri-with-password"
description = "PostgreSQL connection URI containing a password"
# gitleaks compiles these patterns with Go's RE2 engine, which has no
# lookaround — the negative lookahead this rule used to carry made
# `MustCompile` panic, so the whole scan aborted with exit code 2 before it
# examined a single file. Placeholder passwords are filtered by the allowlist
# below instead, and `secretGroup` exposes just the password so that filtering
# works on the value rather than on the whole URI.
# Both the user and the password must be literals: `$`/`{`/`}` in either
# position means the URI is an interpolation (`${POSTGRES_PASSWORD:-postgres}`,
# `$(POSTGRES_PASSWORD)`) and therefore carries no secret.
regex = '''postgres(?:ql)?://[A-Za-z0-9_.-]+:([^@\s${}]{6,})@'''
secretGroup = 1
tags = ["database", "credentials"]

# ── Allowlist ─────────────────────────────────────────────────────────────────

[allowlist]
description = "Global allowlist"
paths = [
  '''pnpm-lock\.yaml''',
  '''package-lock\.json''',
  '''yarn\.lock''',
  '''node_modules/''',
  '''dist/''',
  '''\.turbo/''',
  '''coverage/''',
  '''\.next/''',
  '''apps/mobile/\.expo/''',
  # Cargo build output. `.gitignore` keeps this out of the repository, but a
  # dirty working tree still has it on disk, and rlib metadata contains the
  # literal `PRIVATE KEY` PEM header from the crypto crates.
  '''(^|/)target/''',
  '''(^|/)artifacts/''',
  # Template files hold placeholders by design, and are documented as such.
  '''\.env\.example''',
  '''\.env\.\w+\.example''',
  # Contract test fixtures use throwaway keys and addresses.
  '''packages/contracts/.*test.*\.rs''',
]

# Exact placeholder strings that appear in docs, templates, and test fixtures.
# These are values a human can see are not real.
regexes = [
  '''change-me''',
  '''changeme''',
  '''CHANGE_ME''',
  '''your-.*-here''',
  '''xxx+''',
  '''placeholder''',
  '''epay_dev''',
  '''epay_test''',
  '''epay_drill''',
  # Passwords used by docker-compose and the CI service containers. They are
  # local-only credentials, and the `paths` allowlist above does not cover
  # workflow files or compose files.
  '''^(epay|postgres|postgresql)$''',
  # Test-only Stellar accounts: `G` followed by a repeated character.
  '''G(A{55}|B{55}|A{10}F\d+[A-Z0-9]*)''',
  '''A{40,}''',
  '''mock_signature_[A-Za-z0-9]+''',
  # Documented local-testing placeholder, e.g. `export EPAY_WEBHOOK_SECRET=whsec_test_2f5a1c`
  # in docs/webhook-receiver.md. The `_test_` infix is what marks it as fake.
  '''whsec_test_[A-Za-z0-9]+''',
  # Truncated example token in packages/sdk/README.md. The literal `...` is part
  # of the placeholder, so this can only ever match documentation.
  '''eyJ[A-Za-z0-9_-]*\.\.\.''',
  # Connection URIs whose "password" is a variable reference, not a literal:
  #   ${POSTGRES_PASSWORD:-postgres}   docker-compose / CI service containers
  #   $(POSTGRES_PASSWORD)             Kubernetes env substitution
  #   <password>                       restore-runbook placeholder
  '''^\$\{[A-Z0-9_]+:-[^}]*\}$''',
  '''^\$\([A-Z0-9_]+\)$''',
  '''^<[a-z-]+>$''',
]
