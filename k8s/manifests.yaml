# Source: epay/templates/postgres.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: epay-epay-postgres
  labels:
    helm.sh/chart: epay-0.1.0
    app.kubernetes.io/name: epay
    app.kubernetes.io/instance: epay
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: epay
    app.kubernetes.io/component: database
spec:
  serviceName: epay-epay-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: epay
      app.kubernetes.io/instance: epay
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: epay
        app.kubernetes.io/instance: epay
        app.kubernetes.io/component: database
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: ghcr.io/damideji/postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "epay"
            - name: POSTGRES_DB
              value: "epay"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: epay-postgres
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ['pg_isready', '-U', "epay", '-d', "epay"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ['pg_isready', '-U', "epay"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
            requests:
              cpu: 250m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ['ReadWriteOnce']
        resources:
          requests:
            storage: 20Gi
