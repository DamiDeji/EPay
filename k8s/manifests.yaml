apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: epay-epay-api
  labels:
    helm.sh/chart: epay-0.1.0
    app.kubernetes.io/name: epay
    app.kubernetes.io/instance: epay
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: epay
    app.kubernetes.io/component: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: epay-epay-api
  minReplicas: 2
  maxReplicas: 10
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
