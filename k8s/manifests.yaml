# Source: epay/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: epay-epay
  labels:
    helm.sh/chart: epay-0.1.0
    app.kubernetes.io/name: epay
    app.kubernetes.io/instance: epay
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: epay
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
      - epay.example.com
      - merchant.epay.example.com
      - admin.epay.example.com
      secretName: epay-tls
  rules:
    - host: epay.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: epay-epay-api
                port:
                  number: 80
    - host: epay.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: epay-epay-web
                port:
                  number: 80
    - host: merchant.epay.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: epay-epay-merchant-dashboard
                port:
                  number: 80
    - host: admin.epay.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: epay-epay-admin-dashboard
                port:
                  number: 80
