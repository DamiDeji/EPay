# Source: epay/templates/api.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: epay-epay-api
  labels:
    helm.sh/chart: epay-0.1.0
    app.kubernetes.io/name: epay
    app.kubernetes.io/instance: epay
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: epay
    app.kubernetes.io/component: api
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: epay
      app.kubernetes.io/instance: epay
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: epay
        app.kubernetes.io/instance: epay
        app.kubernetes.io/component: api
      annotations:
        checksum/config: cb5a7cfe73189d750b65c5d6d08cc39e3e8d4ab0c7b4416e12dbc2eea907b442
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/damideji/epay-api:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - configMapRef:
                name: epay-epay-config
            - secretRef:
                name: epay-secrets
                optional: true
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: epay-postgres
                  key: password
            - name: DATABASE_URL
              value: postgresql://epay:$(POSTGRES_PASSWORD)@epay-epay-postgres:5432/epay
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
