apiVersion: batch/v1
kind: Job
metadata:
  name: epay-epay-migrate-1
  labels:
    helm.sh/chart: epay-0.1.0
    app.kubernetes.io/name: epay
    app.kubernetes.io/instance: epay
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: epay
    app.kubernetes.io/component: migration
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: '-5'
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: epay
        app.kubernetes.io/instance: epay
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/damideji/epay-api:0.1.0
          imagePullPolicy: IfNotPresent
          command: ['pnpm', '--filter', '@epay/database', 'exec', 'prisma', 'migrate', 'deploy']
          envFrom:
            - configMapRef:
                name: epay-epay-config
            - secretRef:
                name: epay-secrets
                optional: true
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: epay-postgres
                  key: password
            - name: DATABASE_URL
              value: postgresql://epay:$(POSTGRES_PASSWORD)@epay-epay-postgres:5432/epay
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
