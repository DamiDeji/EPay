packages:
  - 'apps/*'
  - 'packages/*'
  # The Playwright suite lives outside apps/ and packages/ because it drives
  # every app. It is still a workspace package so that `pnpm install` resolves
  # it from the committed lockfile instead of an unpinned `npm install`.
  - 'tests'

# pnpm 10 reads settings from this file rather than the root package.json
# "pnpm" field, which is now ignored.
onlyBuiltDependencies:
  - '@nestjs/core'
  - '@prisma/client'
  - '@prisma/engines'
  - esbuild
  - msgpackr-extract
  - prisma
  - protobufjs
  - sharp

# vitest 4 requires vite ^6 || ^7 || ^8. The committed lockfile had resolved
# vite 5.4.21, which fails at runtime with ERR_PACKAGE_PATH_NOT_EXPORTED
# (./module-runner) and breaks every vitest suite in the monorepo.
overrides:
  vite: ^7.0.0
